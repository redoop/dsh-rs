[package]
name = "dsh-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Message / ContentBlock / StreamChunk vocabulary, the LLM adapter seam, and the block assembler for dsh-rs."

[dependencies]
cordis.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true

[features]
default = ["openai"]
# OpenAI-compatible chat-completions adapter over HTTP/SSE.
openai = ["dep:reqwest", "dep:futures-util", "dep:bytes"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "stream", "rustls-tls"]
optional = true

[dependencies.futures-util]
version = "0.3"
optional = true

[dependencies.bytes]
version = "1"
optional = true
